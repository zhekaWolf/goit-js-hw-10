<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snackbar</title>
    <script type="module" crossorigin src="/goit-js-hw-10/2-snackbar.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-10/assets/vendor-BbbuE1sJ.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-CZjNVMTf.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/2-snackbar-C9_ZjFeX.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-DvPDDfy5.css">
  </head>
  <body>
    <main>
      <div class="container">
        <h1 class="main-title">
          <span class="main-title-gradient">Welcome</span> to snackbar
        </h1>

        <a class="back-link" href="./index.html">Go back</a>


        <form class="form" autocomplete="off">
          <label class="form__label">
            Delay (ms)
            <input type="number" name="delay" min="0" step="100" required />
          </label>

          <fieldset class="form__fieldset">
            <legend>State</legend>
            <label class="form__radio">
              <input type="radio" name="state" value="fulfilled" required />
              Fulfilled
            </label>
            <label class="form__radio">
              <input type="radio" name="state" value="rejected" required />
              Rejected
            </label>
          </fieldset>

        <button class="form__btn" type="submit">Create notification</button>
        </form>
      </div>
    </main>

  </body>
</html>
